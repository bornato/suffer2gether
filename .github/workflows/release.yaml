---
name: Build and Release
run-name: Build and Release
on:
  push:
    tags:
      - v*


# Only the packaging job needs to write (create the release); the build
# jobs run with read access.
permissions:
  contents: read


jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      upload-artifacts: true
      version: ${{ github.ref_name }}


  package-and-release:
    if: needs.build.outputs.is_valid == 'true'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Create release notes
        env:
          VERSION_MAJOR: ${{ needs.build.outputs.version_major }}
          VERSION_MINOR: ${{ needs.build.outputs.version_minor }}
          VERSION_PATCH: ${{ needs.build.outputs.version_patch }}
        run: |
          if [ ! -f ./CHANGELOG.md ]; then
            touch ./release_notes.md
          else
            awk -v ver="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}" \
              '/^## \[/ { if (found) { exit } if ($0 ~ "\\[" ver "\\]") { found=1 } } found' \
              ./CHANGELOG.md > ./release_notes.md
          fi

      # SHA256SUMS lists the archives *and* the binaries inside them, so a
      # user can verify an extracted executable directly.
      - name: Package Linux binaries
        env:
          RELEASE_FILE: suffer2gether-${{ github.ref_name }}-linux-x86_64.tgz
        run: |
          cd release
          chmod a+x ./suffer2gether
          sha256sum suffer2gether >> SHA256SUMS
          tar -zcvf ./${RELEASE_FILE} ./suffer2gether
          sha256sum ${RELEASE_FILE} >> SHA256SUMS

      # The Windows job hashed the executables on the runner that built them;
      # re-checking here proves the artifacts arrived unaltered.
      - name: Package Windows binaries
        env:
          RELEASE_FILE: suffer2gether-${{ github.ref_name }}-windows-x86.zip
        run: |
          cd release
          sha256sum -c SHA256SUMS-windows.txt
          sha256sum suffer2gether.exe suffer2gether-cli.exe >> SHA256SUMS
          zip -9 -D ./${RELEASE_FILE} ./suffer2gether.exe ./suffer2gether-cli.exe
          sha256sum ${RELEASE_FILE} >> SHA256SUMS

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_FILE: suffer2gether-${{ github.ref_name }}-linux-x86_64.tgz
          WINDOWS_FILE: suffer2gether-${{ github.ref_name }}-windows-x86.zip
        run: |
          {
            echo
            echo "Built from commit ${GITHUB_SHA} by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          } >> ./release_notes.md
          gh release create "${{ github.ref_name }}" -F ./release_notes.md --title "${{ github.ref_name }}" \
            "./release/${LINUX_FILE}" \
            "./release/${WINDOWS_FILE}" \
            "./release/SHA256SUMS" \
            "./release/BUILD-INFO-windows.txt" \
            "./release/suffer2gether.exe.dependents.txt" \
            "./release/suffer2gether.exe.imports.txt"
